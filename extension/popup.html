<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lethea for X</title>
    <style>
      :root { --bg: #0c0c0e; --card: #16171a; --card-2: #1e1f23; --line: rgb(255 255 255 / 0.07); --ink: #f5f5f6; --ink-2: #cfd1d6; --ink-3: #9ea1a8; --ink-4: #6f727a; --silver: #c9ced6; --ok: #22c55e; --caution: #f59e0b; --danger: #ef4444; }
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
      header svg { width: 22px; height: 26px; flex: none; }
      header b { font-size: 15px; letter-spacing: 0.01em; }
      header small { color: var(--ink-4); margin-left: 4px; font-size: 11px; }
      .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 11px; }
      .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgb(34 197 94 / 0.15); }
      main { padding: 14px 16px 6px; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
      .stat b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .stat span { color: var(--ink-3); font-size: 11.5px; }
      .stat.warn b { color: #fca5a5; }
      .tokens { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
      .tokens span { padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); font-size: 11px; font-weight: 600; }
      h2 { margin: 16px 0 8px; color: var(--ink-4); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
      li:last-child { border-bottom: 0; }
      li i { width: 8px; height: 8px; border-radius: 50%; background: var(--silver); align-self: center; }
      li.danger i { background: var(--danger); }
      li.caution i { background: var(--caution); }
      li.swap i, li.pay i { background: var(--ok); }
      li span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li time { color: var(--ink-4); font-size: 11px; white-space: nowrap; }
      .empty { color: var(--ink-3); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; }
      .actions { display: flex; gap: 8px; padding: 14px 16px; }
      .actions a { flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; font-weight: 600; text-decoration: none; }
      .primary { background: linear-gradient(180deg, #eef0f3, #c9ced6); color: #0c0c0e; }
      .ghost { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); }
      footer { display: flex; justify-content: space-between; padding: 0 16px 14px; color: var(--ink-4); font-size: 11px; }
      footer button { background: none; border: 0; padding: 0; color: var(--ink-3); font: inherit; cursor: pointer; text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 52 60" aria-hidden="true">
        <path fill="#c9ced6" d="M4.16 23.84a21.84 21.84 0 0 1 43.68 0V54q-7.28 8-14.56 0-7.28 8-14.56 0-7.28 8-14.56 0Z" />
        <ellipse cx="17.7" cy="25.84" rx="4.2" ry="5.4" fill="#0c0c0e" /><ellipse cx="34.3" cy="25.84" rx="4.2" ry="5.4" fill="#0c0c0e" />
      </svg>
      <b>Lethea for X<small id="version"></small></b>
      <span class="status"><i></i>Active on x.com</span>
    </header>
    <main>
      <div class="stats">
        <div class="stat"><b id="tokens">0</b><span>Tokens spotted</span></div>
        <div class="stat"><b id="posts">0</b><span>Posts checked</span></div>
        <div class="stat warn"><b id="flags">0</b><span>Scams flagged</span></div>
        <div class="stat"><b id="opened">0</b><span>Swaps and payments</span></div>
      </div>
      <div class="tokens" id="tokenList"></div>
      <h2>Recent activity</h2>
      <div id="activity"></div>
    </main>
    <div class="actions">
      <a class="primary" id="demo" href="demo.html" target="_blank">Open the demo</a>
      <a class="ghost" href="https://lethea.xyz" target="_blank" rel="noreferrer">lethea.xyz</a>
    </div>
    <footer><span id="since">Counts stay in this browser.</span><button id="reset" type="button">Reset</button></footer>
    <script src="popup.js"></script>
  </body>
</html>
