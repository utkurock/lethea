<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lethea for X</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { width: 340px; }
      header { display: flex; align-items: center; gap: 8px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
      header .logo { font-size: 16px; }
      header small { color: var(--ink-4); font-size: 11px; font-weight: 500; margin-left: 2px; }
      .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); font-size: 11px; font-weight: 500; }
      .status i { width: 6px; height: 6px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px rgb(34 197 94 / 0.16); }
      main { padding: 14px 16px 4px; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat { padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
      .stat b { display: block; font-size: 26px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .stat span { color: var(--ink-3); font-size: 12px; }
      .stat.warn b { color: #fca5a5; }
      .tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .tokens:empty { display: none; }
      .tokens span { height: 24px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; }
      h2 { margin: 18px 0 6px; color: var(--ink-4); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
      li:last-child { border-bottom: 0; }
      li i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
      li.danger i { background: var(--down); }
      li.caution i { background: var(--caution); }
      li.swap i, li.pay i { background: var(--up); }
      li span { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li time { color: var(--ink-4); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .empty { margin: 0; padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); font-size: 13px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 16px 12px; }
      footer { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 14px; color: var(--ink-4); font-size: 11px; }
      footer button { padding: 0; border: 0; background: none; color: var(--ink-3); font: 500 11px var(--font); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
      footer button:hover { color: var(--ink); }
    </style>
  </head>
  <body>
    <header class="dots">
      <span class="logo">
        <svg viewBox="0 0 52 60" aria-hidden="true">
          <defs><radialGradient id="shade" cx="16.2" cy="16.2" r="45" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f5f5f6" /><stop offset="1" stop-color="#8a8d94" /></radialGradient></defs>
          <path fill="url(#shade)" d="M4.16 23.84a21.84 21.84 0 0 1 43.68 0V54q-7.28 8-14.56 0-7.28 8-14.56 0-7.28 8-14.56 0Z" />
          <ellipse cx="17.7" cy="25.84" rx="4.2" ry="5.4" fill="#0c0c0e" /><ellipse cx="34.3" cy="25.84" rx="4.2" ry="5.4" fill="#0c0c0e" />
          <path d="M30.56 34.66a4 4 0 0 1-7.12 0" fill="none" stroke="#0c0c0e" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        Lethea for X<small id="version"></small>
      </span>
      <span class="status"><i></i>Active on x.com</span>
    </header>
    <main>
      <div class="stats">
        <div class="stat"><b id="tokens">0</b><span>Tokens spotted</span></div>
        <div class="stat"><b id="posts">0</b><span>Posts checked</span></div>
        <div class="stat warn"><b id="flags">0</b><span>Scams flagged</span></div>
        <div class="stat"><b id="opened">0</b><span>Swaps and pays</span></div>
      </div>
      <div class="tokens" id="tokenList"></div>
      <h2>Recent activity</h2>
      <div id="activity"></div>
    </main>
    <div class="actions">
      <a class="btn primary" href="demo.html" target="_blank">Open the demo</a>
      <a class="btn" href="https://lethea.xyz/extension" target="_blank" rel="noreferrer">lethea.xyz</a>
    </div>
    <footer><span id="since">Counts stay in this browser.</span><button id="reset" type="button">Reset</button></footer>
    <script src="popup.js"></script>
  </body>
</html>
